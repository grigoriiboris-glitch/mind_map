proxy_cache_path /var/cache/nginx/auth_cache levels=1:2 keys_zone=auth_cache:10m inactive=10m max_size=50m;

server {
    listen 80;

    # 1️⃣ Публичные пути авторизации
    location /api/auth/ {
        proxy_pass http://auth_service:8000;
        proxy_http_version 1.1;

        # Передаем правильный Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Для WebSocket (HMR / сокеты)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2️⃣ Внутренний location для auth_request
    location = /auth_validate {
        internal;
        proxy_pass http://auth_service:8000/api/auth/user;


            # Кэширование
            proxy_cache auth_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_key $http_cookie;

        # Передаем токен из cookie
        proxy_set_header Cookie $http_cookie;

        # Прерываем на ошибки auth_service
        proxy_intercept_errors on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3️⃣ Все защищенные API
    location /api/ {
        # Проверка токена
        auth_request /auth_validate;

        # Получаем заголовки из auth_service
        # auth_request_set $user_body $upstream_http_x_user_body;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $user_body $upstream_http_x_user_body;

        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-User-Body $user_body;

        # Передаем корректный Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://api-backend:8000;
    }

    # 4️⃣ Frontend SPA
    location / {
        proxy_pass http://mindmap-frontend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Для WebSocket HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
